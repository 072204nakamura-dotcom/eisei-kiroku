<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仕込み・衛生管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F4F5; --ink: #1F2B33; --sub: #5E6C75; --line: #D3DADE;
    --ok: #2E7A58; --ok-bg: #E2F0E8; --ng: #B3322A; --ng-bg: #F7E3E1;
    --warn: #9A6A0E; --warn-bg: #FFF7E6;
    --store: #274261; --store-soft: #E4EAF1;
  }
  body.teru { --store: #9A6A0E; --store-soft: #F5ECD9; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 16px; line-height: 1.55;
    padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  }
  body.dirty { padding-bottom: calc(146px + env(safe-area-inset-bottom, 0px)); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--store); outline-offset: 2px; }

  .helpbar { display: flex; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--paper); max-width: 640px; margin: 0 auto; }
  .helpbar a, .helpbar button {
    flex: 1; text-align: center; border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
    padding: 8px 0; font-size: 13px; font-weight: 700; color: var(--sub); text-decoration: none;
  }
  /* ご意見箱 */
  #fbpanel { position: fixed; inset: 0; z-index: 70; background: rgba(31,43,51,.45); display: none; align-items: flex-end; justify-content: center; }
  #fbpanel:not([hidden]) { display: flex; }
  #fbpanel .box { background: #fff; width: 100%; max-width: 640px; border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow-y: auto; }
  #fbpanel h3 { margin: 0 0 4px; font-size: 17px; }
  #fbpanel .fbkinds { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
  #fbpanel .fbkinds button { padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; font-size: 14px; }
  #fbpanel .fbkinds button.on { background: var(--store); border-color: var(--store); color: #fff; font-weight: 700; }
  #fbpanel .primary { margin: 12px 0 4px; height: 50px; }

  header {
    background: var(--store); color: #fff;
    padding: 14px 16px 14px;
    position: sticky; top: 0; z-index: 20;
  }
  .storename { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  .switch { display: flex; gap: 6px; margin-top: 10px; }
  .switch button {
    flex: 1; border: 1.5px solid rgba(255,255,255,.55); background: transparent;
    color: #fff; border-radius: 999px; padding: 7px 0; font-size: 14px;
  }
  .switch button.on { background: #fff; color: var(--store); border-color: #fff; font-weight: 700; }

  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 17px; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 .prog { font-size: 13px; color: var(--sub); font-weight: 400; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fields3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  label.f { display: block; font-size: 13px; color: var(--sub); }
  label.f input, label.f select, textarea.big {
    display: block; width: 100%; margin-top: 4px; padding: 10px 12px;
    border: 1.5px solid var(--line); border-radius: 8px; background: #fff; font-size: 16px; color: var(--ink);
  }
  label.f select { padding: 10px 6px; }
  textarea.big { min-height: 96px; resize: vertical; }
  label.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 8px 0; margin-top: 8px; }
  label.chk input { width: 22px; height: 22px; margin: 0; }

  .status { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--store-soft); font-size: 14px; }
  .status:empty { display: none; }
  .hint { font-size: 13px; color: var(--sub); }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; margin-left: 6px;
    border-radius: 999px; vertical-align: 2px; background: var(--store-soft); color: var(--store);
  }
  .tag.vac { background: #E8E8E8; color: #444; }

  .item, .lot { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .item.ok { border-color: var(--ok); }
  .item.ng { border-color: var(--ng); background: #FFFBFA; }
  .top { display: flex; gap: 10px; align-items: center; }
  .txt { flex: 1; min-width: 0; }
  .txt b { display: block; font-size: 16px; }
  .txt small { display: block; font-size: 13px; color: var(--sub); line-height: 1.45; margin-top: 2px; }
  .txt .short { color: var(--ng); font-weight: 700; }
  .menus { font-size: 13px; color: var(--store); margin-top: 4px; }

  .yn { display: flex; gap: 6px; flex-shrink: 0; }
  .yn button {
    width: 54px; height: 50px; border-radius: 10px; font-size: 24px; font-weight: 700;
    border: 1.5px solid var(--line); background: #fff; color: var(--sub);
  }
  .yn button[data-v="ok"].on, .yn button[data-fv="ok"].on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .yn button[data-v="ng"].on, .yn button[data-fv="ng"].on { background: var(--ng); border-color: var(--ng); color: #fff; }

  .opts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .opts button {
    flex: 1; min-width: 120px; padding: 10px 8px; border-radius: 8px;
    border: 1.5px solid var(--line); background: #fff; font-size: 14px;
  }
  .opts button.on { background: var(--store); border-color: var(--store); color: #fff; font-weight: 700; }

  textarea.note {
    width: 100%; margin-top: 10px; padding: 9px 11px; min-height: 64px;
    border: 1.5px solid var(--ng); border-radius: 8px; font-size: 15px; resize: vertical; background: #fff;
  }

  .primary {
    display: block; width: 100%; margin: 20px 0 8px; height: 54px;
    border: none; border-radius: 12px; background: var(--store); color: #fff; font-size: 17px; font-weight: 700;
  }
  .primary:disabled { opacity: .5; }
  .secondary { border: 1.5px solid var(--store); color: var(--store); background: #fff; border-radius: 8px; padding: 8px 14px; font-size: 14px; white-space: nowrap; }
  .linkbtn { border: none; background: none; color: var(--sub); font-size: 14px; text-decoration: underline; padding: 6px 2px; }
  .addrow { display: flex; gap: 8px; margin-top: 4px; }
  .addrow select { flex: 0 0 auto; max-width: 38%; padding: 10px 4px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; font-size: 15px; }
  .addrow input { flex: 1; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 16px; }

  /* 在庫 */
  .lot.warn { border-color: #C98A1B; background: var(--warn-bg); }
  .lot.over { border-color: var(--ng); background: #FFF3F2; }
  .lot .exp { text-align: center; flex-shrink: 0; min-width: 66px; font-size: 11px; color: var(--sub); line-height: 1.3; }
  .lot .exp b { display: block; font-size: 19px; color: var(--ink); }
  .lot.warn .exp b, .lot.warn .exp { color: var(--warn); }
  .lot.over .exp b, .lot.over .exp { color: var(--ng); }
  .lotacts { display: flex; gap: 6px; margin-top: 10px; }
  .lotacts button { flex: 1; padding: 9px 2px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; font-size: 13px; }
  .lotacts button.fire { border-color: var(--store); color: var(--store); font-weight: 700; }
  .lotacts button.disc { color: var(--ng); }
  .edit { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .ended { opacity: .75; }

  /* 仕込みフォーム */
  .form { margin-top: 12px; padding: 12px; background: var(--store-soft); border-radius: 10px; }
  .form .acts { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .form .primary { margin: 0; height: 46px; flex: 1; font-size: 15px; }
  .unit { font-size: 14px; color: var(--sub); margin-left: 6px; }

  h3.grp { font-size: 15px; margin: 16px 0 6px; padding-bottom: 4px; color: var(--store); border-bottom: 2px solid var(--store-soft); display: flex; justify-content: space-between; align-items: baseline; }
  h3.grp .prog { font-size: 12px; color: var(--sub); font-weight: 400; }
  .mrow .acts { display: flex; gap: 16px; margin-top: 8px; justify-content: flex-end; }

  .summary { display: flex; gap: 8px; margin: 12px 0; }
  .summary div { flex: 1; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--sub); }
  .summary b { display: block; font-size: 22px; color: var(--ink); }
  .summary .bad b { color: var(--ng); }
  .ngs { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 12px; }
  .ngs p { margin: 8px 0; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
  .ngs p:last-child { border-bottom: none; }

  .tablewrap { overflow-x: auto; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; }
  table.month { border-collapse: collapse; font-size: 12px; white-space: nowrap; min-width: 100%; }
  table.month th, table.month td { border: 1px solid var(--line); padding: 5px 6px; text-align: center; }
  table.month th { background: var(--store-soft); font-weight: 700; }
  table.month td.n { text-align: left; white-space: normal; min-width: 180px; }
  table.month td.x { color: var(--ng); font-weight: 700; }
  table.month td.o { color: var(--ok); }
  table.month tr.none td { color: #A5B0B6; }
  table.month tr.sun td:first-child, table.month tr.sun td:nth-child(2) { color: var(--ng); }
  .printhead { display: none; }

  /* 食中毒の参考パネル */
  #refpanel { position: fixed; inset: 0; z-index: 60; background: var(--paper); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #refpanel .bar { position: sticky; top: 0; background: var(--store); color: #fff; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; justify-content: space-between; align-items: center; }
  #refpanel .bar b { font-size: 17px; }
  #refpanel .bar button { border: 1.5px solid rgba(255,255,255,.7); background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  #refpanel .in { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .ref { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .ref b.nm { font-size: 16px; display: block; }
  .ref .kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .ref .kind.v { background: #E4D9F5; color: #4B2E83; }
  .ref .kind.b { background: #DCEBF5; color: #1F4E79; }
  .ref .kind.p { background: #E2F0E8; color: #2E7A58; }
  .ref dl { margin: 8px 0 0; font-size: 14px; line-height: 1.5; }
  .ref dt { color: var(--sub); font-size: 12px; margin-top: 6px; }
  .ref dd { margin: 0; }
  .ref dd .chk { color: var(--store); font-weight: 700; }
  .principle { background: var(--store-soft); border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.6; margin-bottom: 12px; }

  #savebar { position: fixed; left: 12px; right: 12px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 40; }
  #savebar button {
    width: 100%; height: 52px; border: none; border-radius: 12px; background: var(--ng); color: #fff;
    font-size: 16px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.22);
  }
  #savebar button:disabled { opacity: .6; }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff; border-top: 1.5px solid var(--line); display: flex;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav button { flex: 1; height: 62px; border: none; background: none; font-size: 11px; color: var(--sub); border-top: 3px solid transparent; }
  nav button b { display: block; font-size: 14px; }
  nav button.on { color: var(--store); border-top-color: var(--store); font-weight: 700; }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 15px; z-index: 50; display: none;
  }
  body.dirty #toast { bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    header, nav, .noprint, #toast, #savebar { display: none !important; }
    body { background: #fff; padding: 0; }
    main { max-width: none; padding: 0; }
    .printhead { display: block; font-size: 14pt; font-weight: 700; margin-bottom: 4mm; }
    .tablewrap { overflow: visible; border: none; }
    table.month { font-size: 9pt; }
    table.month th, table.month td { border-color: #333; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="helpbar">
  <a href="manual.html" target="_blank" rel="noopener">❓ 使い方</a>
  <button type="button" id="fbBtn">💬 ご意見箱</button>
</div>

<header>
  <div class="storename" id="storeName"></div>
  <div class="switch">
    <button data-store="nakamura">なかむら</button>
    <button data-store="teru">Café照</button>
  </div>
</header>

<main id="view"></main>

<div id="savebar" hidden><button id="saveStock">仕込み表を保存する</button></div>

<nav>
  <button data-tab="prep"><b>仕込み</b>在庫と作業</button>
  <button data-tab="rec"><b>衛生</b>記録する</button>
  <button data-tab="list"><b>一覧</b>月の記録</button>
  <button data-tab="rev"><b>振り返り</b>月1回</button>
  <button data-tab="plan"><b>計画</b>店の設定</button>
</nav>

<div id="fbpanel" hidden>
  <div class="box">
    <h3>💬 ご意見箱</h3>
    <p class="hint" style="margin:0 0 10px">使いにくいところ、分からないところを送ってください。小さなことでも大歓迎です。名前は無くても送れます。</p>
    <div id="fbName"></div>
    <div class="hint" style="margin-top:10px">種類</div>
    <div class="fbkinds" id="fbKinds"></div>
    <div class="hint">内容</div>
    <textarea class="big" id="fbText" placeholder="例：在庫の並び順を変えたい／火入れの意味が分かりにくい"></textarea>
    <button type="button" class="primary" id="fbSend">送信する</button>
    <button type="button" class="linkbtn" id="fbCancel" style="width:100%">キャンセル</button>
  </div>
</div>

<div id="refpanel" hidden>
  <div class="bar"><b>食中毒の原因になる菌・ウイルス</b><button type="button" id="refClose">閉じる</button></div>
  <div class="in" id="refBody"></div>
</div>

<div id="toast"></div>

<script>
// ▼ ここにGASのウェブアプリURLを貼る（https://script.google.com/macros/s/…/exec）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz6gQKEPas5OjiqTgoGMkO_rutK3pidKRRepPNb8IFEyEYASZ4vEgYCNxMdp4ZVNBQExw/exec';

// ▼ ご意見箱の送り先（献立管理システムのGASのURL。ご意見はそこの DATA_FEEDBACK シートに集まる）
const FEEDBACK_URL = 'https://script.google.com/macros/s/AKfycbwqIJ_b3CTXJsHoi42encJbSyP-ZGwRKzQZKqQmCbpWgd_Eh3LTtIkwWz1nmKIuHQXTpg/exec';
const FEEDBACK_APP_NAME = '仕込み・衛生管理';
const FEEDBACK_KINDS = ['困っている', 'こうしてほしい', '不具合', 'その他'];

const STORES = { nakamura: '洋食だいにんぐなかむら', teru: 'Café照' };
const PREP_DEFAULT = { nakamura: false, teru: true };   // 仕込み表（在庫・明日の仕込み）を使う店。計画タブで切り替えられる
function prepOn() {
  const p = state.plan;
  if (p && typeof p.usePrep === 'boolean') return p.usePrep;
  return PREP_DEFAULT[state.store] !== false;
}
const T_REC = 'record', T_REV = 'review';   // スプレッドシートのTYPE列と同じ英字
const DEFAULT_DAYS = 3;      // 真空していないときの保存日数
const FIRE_DAYS = 3;         // 火入れで延びる日数
const KEEP_ENDED_DAYS = 7;   // 使い切り・廃棄した品を台帳に残す日数
const UNITS = ['g', 'ml', '個', '枚', '本', '切れ', 'パック', 'セット', '人前'];
const CLS_SHORT = { c1: '非加熱', c2: '加熱', c3: '冷却再加熱' };

const GENERAL = [
  { k: 'g1', s: '受入', t: '原材料の受入確認', h: '納品時に鮮度・包装の破れ・期限・冷たさを確認' },
  { k: 'g2', s: '温度', t: '冷蔵庫・冷凍庫の温度', h: '冷蔵10℃以下／冷凍−15℃以下' },
  { k: 'g3', s: '汚染', t: '交差汚染・二次汚染の防止', h: '生肉・生魚と加熱済み・生食用でまな板と器具を分ける' },
  { k: 'g4', s: '器具', t: '器具の洗浄・消毒', h: '使用後に洗浄し、まな板・包丁は消毒' },
  { k: 'g5', s: 'トイレ', t: 'トイレの洗浄・消毒', h: 'ドアノブ・水栓・便座も消毒' },
  { k: 'g6', s: '健康', t: '健康管理・作業着', h: '下痢・嘔吐・発熱・手の傷を確認、清潔な作業着と帽子' },
  { k: 'g7', s: '手洗い', t: '手洗い', h: '出勤時・トイレ後・生の食材にふれた後・作業が変わるたび' }
];
const CRITICAL = [
  { k: 'c1', s: '非加熱', t: '非加熱のまま提供', h: '冷蔵から出してすぐ使う。器具と手は消毒済み。仕上げ後すぐ冷蔵' },
  { k: 'c2', s: '加熱', t: '加熱してすぐ提供', h: '中心75℃で1分以上（二枚貝は85〜90℃で90秒以上）' },
  { k: 'c3', s: '冷却再加熱', t: '加熱後に冷却（そのまま提供・再加熱）', h: '小分け・氷水で速やかに冷却。再加熱して出すものは沸騰して温度が上がったのを確認' }
];
const REVIEW = [
  { k: 'r1', t: '記録を書き忘れた日はなかったか', o: ['なかった', 'あった'] },
  { k: 'r2', t: '「×」や問題の記録があったか', o: ['なかった', 'あった'] },
  { k: 'r3', t: '同じ問題が繰り返し起きていないか', o: ['繰り返しなし', 'あり'] },
  { k: 'r4', t: '衛生管理計画が今の作業と合っているか', o: ['合っている', '見直しが必要'] },
  { k: 'r5', t: '新しいメニュー・仕込みが増えていないか', o: ['なし', 'あり（計画に追加）'] },
  { k: 'r6', t: '従業員に内容を伝えたか', o: ['伝えた', 'まだ'] }
];
const ALL_ITEMS = GENERAL.concat(CRITICAL);

// 計画が空のときに読み込める初期品目。分類・日数は目安なので、計画タブで直してから保存する
const PRESETS = {
  nakamura: {
    places: ['冷蔵庫', '台下冷蔵庫', 'キッチン側ショーケース', 'ドリンクショーケース', 'ドリンク冷蔵庫', 'ドリンク台下冷凍冷蔵庫'],
    groups: ['前菜1', '前菜2', '前菜3', 'パスタ', 'スープ', '魚料理', '肉料理', 'デザート'],
    items: []   // なかむらは決まった仕込み品目がない。その日の品目を「明日の仕込み」の欄で区分を選んで入れる
  },
  teru: {
    places: ['台下冷蔵庫', 'ドロワー冷蔵庫', '野菜ショーケース', '厨房冷蔵冷凍庫', 'デザート冷蔵冷凍庫', 'デシャップショーケース', 'レジ前ショーケース', 'ホールショーケース', 'ホール冷凍ストッカー'],
    groups: ['野菜の切りもの', 'ソース類', '調理するもの', '肉類', '魚介類', '小鉢のおかず'],
    items: [

// ---------- 通信 ----------
async function apiGet(params) {
  if (GAS_URL.indexOf('https://') !== 0) throw new Error('GAS_URL がまだ設定されていません');
  const res = await fetch(GAS_URL + '?' + new URLSearchParams(params).toString());
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '読み込みに失敗しました');
  return j;
}
async function apiPost(body) {
  await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
}
async function loadMonth(month, force) {
  const key = state.store + '|' + month;
  if (!force && cache[key]) return cache[key];
  const j = await apiGet({ action: 'list', store: state.store, month: month });
  cache[key] = j.items;
  return j.items;
}
async function loadPlan() {
  const j = await apiGet({ action: 'plan', store: state.store });
  state.plan = Object.assign({ c1: [], c2: [], c3: [], items: [], places: [], staff: [], groups: [] }, j.plan || {});
  state.planSavedAt = j.savedAt;
}
function normLedger(l) {
  l = l || {};
  return { lots: Array.isArray(l.lots) ? l.lots : [], people: l.people || {} };
}
async function fetchStock() {
  const j = await apiGet({ action: 'stock', store: state.store });
  return { ledger: normLedger(j.ledger), savedAt: j.savedAt || '' };
}
async function loadStock() {
  const r = await fetchStock();
  state.stock = r.ledger; state.stockSavedAt = r.savedAt;
}
// no-cors では保存の結果が読めないので、読み直して本当に増えたかを確かめる
async function confirmSaved(month, type, date, prevVersions) {
  for (let i = 0; i < 4; i++) {
    await sleep(1500);
    try {
      const items = await loadMonth(month, true);
      const f = items.find(x => x.type === type && x.date === date);
      if (f && f.versions > prevVersions) return f;
    } catch (e) { /* 次の回でもう一度 */ }
  }
  return null;
}

// ---------- 画面の切り替え ----------
function leaveOk() {
  if (!dirty) return true;
  return confirm('保存していない仕込み表の変更が' + dirty + '件あります。捨てて移動しますか？');
}
function setStore(s) {
  if (s === state.store && state.plan) return;
  if (!leaveOk()) return;
  dirty = 0; openForm = null; editLot = null; peopleTouched = false;
  state.store = s;
  document.body.classList.toggle('teru', s === 'teru');
  $('#storeName').textContent = STORES[s];
  document.querySelectorAll('.switch button').forEach(b => b.classList.toggle('on', b.dataset.store === s));
  state.plan = null; state.stock = null;
  render();
}
function setTab(t) {
  if (t === state.tab) return;
  state.tab = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  window.scrollTo(0, 0);
  render();
}
function updateSaveBar() {
  const bar = $('#savebar');
  bar.hidden = !dirty;
  document.body.classList.toggle('dirty', dirty > 0);
  const b = $('#saveStock');
  if (!b.disabled) b.textContent = '仕込み表を保存する（未保存 ' + dirty + '件）';
}
function markDirty() { dirty++; updateSaveBar(); }
async function render() {
  const my = ++token;
  view.innerHTML = '<p class="hint">読み込み中…</p>';
  try {
    if (!state.plan) await loadPlan();
    if (my !== token) return;
    const on = prepOn();
    document.querySelector('nav button[data-tab="prep"]').hidden = !on;
    if (!on && state.tab === 'prep') { state.tab = 'rec'; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'rec')); }
    if ((state.tab === 'prep' || (state.tab === 'rec' && on)) && (!state.stock || !dirty)) await loadStock();
    if (my !== token) return;
    if (state.tab === 'prep') paintPrep();
    if (state.tab === 'rec') await renderRec(my);
    if (state.tab === 'list') await renderList(my);
    if (state.tab === 'rev') await renderRev(my);
    if (state.tab === 'plan') renderPlan();
  } catch (e) {
    if (my !== token) return;
    view.innerHTML = '<div class="status">読み込めませんでした：' + esc(e.message) + '<br>電波を確認して、もう一度開いてください。</div>';
  }
  updateSaveBar();
}

function lotAction(lot, act) {
  const by = state.by.trim();

    lot.f = lot.f || [];

    lot.exp = addDays(today(), FIRE_DAYS);
    toast('火入れ：期限を ' + mdShort(lot.exp) + ' までに延ばしました');
  } else if (act === 'freeze') {
    lot.frz = true; lot.exp = '';
    const fz = freezerPlace(); if (fz) lot.pl = fz;
    toast('冷凍にしました。解凍したら「解凍」を押してください');
  } else if (act === 'thaw') {

    toast('解凍：期限は ' + mdShort(lot.exp) + ' までです');
  } else if (act === 'use') {

  } else if (act === 'disc') {

    if (why === null) return;
    lot.st = 'disc'; lot.end = today(); lot.eb = by; lot.why = why.trim();
  } else if (act === 'undo') {

  } else if (act === 'edit') {

  }
  lot.at = nowIso();

}
// ---- 保存（ほかの人の変更とまとめる） ----
function mergeLedger(local, server) {
  const out = { lots: [], people: Object.assign({}, (server && server.people) || {}) };
  const map = {};
  ((server && server.lots) || []).forEach(l => map[l.id] = l);
  local.lots.forEach(l => { const s = map[l.id]; if (!s || (l.at || '') >= (s.at || '')) map[l.id] = l; });
  out.lots = Object.keys(map).map(k => map[k]);
  Object.keys(local.people || {}).forEach(d => {
    const a = local.people[d], b = out.people[d];
    if (!b || (a.at || '') >= (b.at || '')) out.people[d] = a;
  });
  return out;
}
function serverHas(server, local) {
  const map = {}; server.lots.forEach(l => map[l.id] = l);
  return local.lots.every(l => map[l.id] && (map[l.id].at || '') >= (l.at || ''));
}
function prune(L) {
  const cut = addDays(today(), -KEEP_ENDED_DAYS);
  L.lots = L.lots.filter(l => l.st === 'in' || !l.end || l.end >= cut);
  Object.keys(L.people).forEach(d => { if (d < cut) delete L.people[d]; });
  // 台帳が大きくなりすぎたら、終わった品の古いものから外す（元の行はスプレッドシートに残る）
  while (JSON.stringify(L).length > 45000) {
    const ended = L.lots.filter(l => l.st !== 'in').sort((a, b) => (a.end || '') < (b.end || '') ? -1 : 1);
    if (!ended.length) break;
    L.lots = L.lots.filter(l => l.id !== ended[0].id);
  }
}
async function saveStock() {
  const by = state.by.trim();
  if (!by) { toast('記入者を選んでください'); const f = $('#by'); if (f) f.focus(); return; }
  const btn = $('#saveStock'); btn.disabled = true; btn.textContent = '保存しています…';
  try {
    let server = null;
    try { server = await fetchStock(); } catch (e) { /* 読めなくても保存は続ける */ }
    const merged = mergeLedger(state.stock, server ? server.ledger : null);
    prune(merged);
    await apiPost({ type: 'stock', store: state.store, by: by, data: merged });
    for (let i = 0; i < 4; i++) {
      await sleep(1500);
      try {
        const r = await fetchStock();
        if (serverHas(r.ledger, merged)) {
          state.stock = r.ledger; state.stockSavedAt = r.savedAt;
          dirty = 0; peopleTouched = false; btn.disabled = false;
          toast('保存しました');
          if (state.tab === 'prep') paintPrep();
          updateSaveBar();
          return;
        }
      } catch (e) { /* 次の回でもう一度 */ }
    }
    toast('保存を確認できませんでした。電波を確認して、もう一度保存してください');
  } catch (e) {
    toast('保存できませんでした：' + e.message);
  }

}

    '<div style="display:flex;align-items:flex-end"><button class="secondary" id="printBtn" style="width:100%;height:46px">印刷する</button></div></div>' +
    '<div class="summary"><div><b>' + recorded + '日</b>記録した日</div><div class="' + (ngCount ? 'bad' : '') + '"><b>' + ngCount + '件</b>×の記録</div></div></div>' +
    '<div class="printhead">衛生管理 実施記録　' + STORES[state.store] + '　' + y + '年' + mo + '月</div>' +
    '<div class="tablewrap"><table class="month"><tr><th>日</th><th>曜</th>' +
    GENERAL.map(i => '<th>' + i.s + '</th>').join('') + CRITICAL.map(i => '<th>' + i.s + '</th>').join('') +
    '<th>記入者</th><th>×のとき、どうしたか</th></tr>' + rows + '</table></div>' +
    '<p class="hint noprint">直した記録も消えずにスプレッドシートに残ります。</p>';
  $('#listMonth').onchange = e => { state.listMonth = e.target.value || today().slice(0, 7); render(); };
  $('#printBtn').onclick = () => window.print();
}

// ---------- 毎月の振り返り ----------
async function renderRev(my) {
  const m = state.revMonth;
  const items = await loadMonth(m, true);
  if (my !== token) return;
  const recs = items.filter(i => i.type === T_REC).sort((a, b) => a.date < b.date ? -1 : 1);
  const ex = items.find(i => i.type === T_REV && i.date === m);
  const y = +m.slice(0, 4), mo = +m.slice(5, 7);
  const daysSoFar = m === today().slice(0, 7) ? new Date().getDate() : new Date(y, mo, 0).getDate();
  const ngs = [];
  recs.forEach(r => ALL_ITEMS.forEach(it => { const a = (r.data.answers || {})[it.k]; if (a && a.v === 'ng') ngs.push({ date: r.date, t: it.t, note: a.note }); }));
  rev = {
    month: m, answers: ex ? Object.assign({}, ex.data.answers) : {},
    trouble: ex ? (ex.data.trouble || '') : ngs.map(n => (+n.date.slice(8)) + '日 ' + n.t + '：' + n.note).join('\n'),
    next: ex ? (ex.data.next || '') : '', prev: ex ? ex.versions : 0
  };
  view.innerHTML =
    '<div class="fields"><label class="f">振り返る月<input type="month" id="revMonth" value="' + m + '"></label>' +
    byField('実施者') + '</div>' +
    '<div class="status">' + (ex ? 'この月は振り返り済みです（' + esc(ex.by) + '）。' : '') + '</div>' +
    '<div class="summary"><div><b>' + recs.length + ' / ' + daysSoFar + '日</b>記録した日</div><div class="' + (ngs.length ? 'bad' : '') + '"><b>' + ngs.length + '件</b>×の記録</div></div>' +
    (ngs.length ? '<div class="ngs">' + ngs.map(n => '<p><b>' + (+n.date.slice(8)) + '日 ' + esc(n.t) + '</b><br>' + esc(n.note) + '</p>').join('') + '</div>' : '') +
    '<h2>確認すること</h2>' +
    REVIEW.map(q => '<div class="item" data-g="rev" data-k="' + q.k + '"><div class="txt"><b>' + q.t + '</b></div><div class="opts">' +
      q.o.map(o => '<button type="button" data-v="' + esc(o) + '" class="' + (rev.answers[q.k] === o ? 'on' : '') + '">' + esc(o) + '</button>').join('') + '</div></div>').join('') +
    '<h2>起きた問題と、どう直したか</h2><textarea class="big" id="trouble" placeholder="なければ「特になし」">' + esc(rev.trouble) + '</textarea>' +
    '<h2>来月に向けて直すこと</h2><textarea class="big" id="next" placeholder="なければ「特になし」">' + esc(rev.next) + '</textarea>' +
    '<button class="primary" id="saveRev">振り返りを保存する</button>';
  $('#revMonth').onchange = e => { state.revMonth = e.target.value || today().slice(0, 7); render(); };
  bindBy();
  $('#trouble').oninput = e => rev.trouble = e.target.value;
  $('#next').oninput = e => rev.next = e.target.value;
  $('#saveRev').onclick = saveRev;
}
async function saveRev() {
  const by = state.by.trim();
  if (!by) return toast('実施者を選んでください');
  const missing = REVIEW.find(q => !rev.answers[q.k]);
  if (missing) return toast('まだ答えていません：' + missing.t);
  if (!rev.trouble.trim() || !rev.next.trim()) return toast('問題がなければ「特になし」と書いてください');
  const btn = $('#saveRev'); btn.disabled = true; btn.textContent = '保存しています…';
  try {
    await apiPost({ type: 'review', store: state.store, date: rev.month, by: by, data: { answers: rev.answers, trouble: rev.trouble, next: rev.next } });
    const ok = await confirmSaved(rev.month, T_REV, rev.month, rev.prev);
    if (ok) { toast('振り返りを保存しました'); render(); return; }
    toast('保存を確認できませんでした。もう一度開いて確かめてください');
  } catch (e) { toast('保存できませんでした：' + e.message); }
  btn.disabled = false; btn.textContent = '振り返りを保存する';
}

// ---------- 計画（品目・保管場所・メニューの分類） ----------
function draftGroups() { const t = $('#groups'); return (t ? t.value : (state.plan.groups || []).join('\n')).split('\n').map(s => s.trim()).filter(Boolean); }
function draftPlaces() { const t = $('#places'); return (t ? t.value : (state.plan.places || []).join('\n')).split('\n').map(s => s.trim()).filter(Boolean); }
function masterHtml(it, idx) {
  const places = draftPlaces(), groups = draftGroups();
  return '<div class="item mrow" data-id="' + it.id + '">' +
    '<label class="f">品目<input data-f="name" value="' + esc(it.name) + '" placeholder="例：デミグラスソース"></label>' +
    '<div class="fields3">' +
      '<label class="f">区分<select data-f="group">' + opt([''].concat(groups), it.group || '', ['（その他）'].concat(groups)) + '</select></label>' +
      '<label class="f">分類<select data-f="cls">' + opt(['', 'c1', 'c2', 'c3'], it.cls || '', ['なし', '非加熱', '加熱', '冷却再加熱']) + '</select></label>' +
      '<label class="f">単位<select data-f="unit">' + opt(UNITS, it.unit || 'g') + '</select></label>' +
    '</div><div class="fields3">' +
      '<label class="f">保管場所<select data-f="place">' + opt([''].concat(places), it.place || '', ['（未設定）'].concat(places)) + '</select></label>' +
      '<label class="f">1人あたり<input data-f="per" inputmode="decimal" value="' + esc(it.per) + '"></label>' +
      '<label class="f">固定量<input data-f="fixed" inputmode="decimal" value="' + esc(it.fixed) + '"></label>' +
    '</div><div class="fields3">' +
      '<label class="f">保存日数<input data-f="days" inputmode="numeric" value="' + esc(it.days) + '" placeholder="' + DEFAULT_DAYS + '"></label>' +
      '<label class="f">真空時の日数<input data-f="vdays" inputmode="numeric" value="' + esc(it.vdays) + '" placeholder="真空なし"></label>' +
      '<label class="f">解凍後の日数<input data-f="fdays" inputmode="numeric" value="' + esc(it.fdays == null ? '' : it.fdays) + '" placeholder="冷凍なし"></label>' +
    '</div>' +
    '<label class="chk"><input type="checkbox" data-f="fire"' + (it.fire ? ' checked' : '') + '>火入れで期限を' + FIRE_DAYS + '日延ばせる（ソース・煮込み）</label><div class="acts">' +
      (idx > 0 ? '<button type="button" class="linkbtn" data-up>上へ</button>' : '') +
      '<button type="button" class="linkbtn" data-del>消す</button>' +
    '</div></div>';
}
function paintMaster() {
  const preset = PRESETS[state.store];
  const parts = preset ? [preset.items.length ? '品目' + preset.items.length + '品' : '', (preset.groups || []).length ? '区分' : '', (preset.places || []).length ? '保管場所' + preset.places.length + 'か所' : ''].filter(Boolean) : [];
  const showPreset = parts.length && (preset.items.length ? !planDraft.length : (!draftPlaces().length || !draftGroups().length));
  $('#mlist').innerHTML = (planDraft.length ? planDraft.map(masterHtml).join('') : '<div class="status">まだ品目がありません。下のボタンから追加してください。</div>') +
    (showPreset ? '<div class="status"><button type="button" class="secondary" id="loadPreset">' + STORES[state.store] + 'の初期設定を読み込む（' + parts.join('・') + '）</button></div>' : '');
  const lp = $('#loadPreset');
  if (lp) lp.onclick = () => {
    const ps = presetItems(state.store);
    if (ps.items.length && !planDraft.length) planDraft = ps.items;
    if (!draftGroups().length && ps.groups.length) $('#groups').value = ps.groups.join('\n');
    if (!draftPlaces().length && ps.places.length) $('#places').value = ps.places.join('\n');
    paintMaster();
    toast('読み込みました。内容を確かめて「計画を保存する」を押してください');
  };
}
function renderPlan() {
  const p = state.plan || {};
  planDraft = JSON.parse(JSON.stringify(p.items || []));
  view.innerHTML =
    '<div class="status">' + (state.planSavedAt ? '' : 'まだ登録されていません') + '</div>' +
    '<label class="chk" style="margin-top:14px"><input type="checkbox" id="usePrep"' + (prepOn() ? ' checked' : '') + '>この店で仕込み表（在庫・明日の仕込み）を使う</label>' +
    '<p class="hint" style="margin-top:-4px">オフにすると「仕込み」タブが消え、衛生の記録だけになります。下の保管場所・区分・仕込み品目の欄も仕込み表用です。</p>' +
    '<div id="prepSettings"' + (prepOn() ? '' : ' hidden') + '>' +
    '<h2>保管場所</h2>' +
    '<p class="hint" style="margin-top:-4px">この店の冷蔵庫・冷凍庫・棚を1行に1つ。仕込むときにここから選びます。</p>' +
    '<textarea class="big" id="places" placeholder="例：台下冷蔵庫①&#10;台下冷蔵庫②&#10;冷凍庫&#10;ウォークイン">' + esc((p.places || []).join('\n')) + '</textarea>' +
    '<h2>スタッフ</h2>' +
    '<p class="hint" style="margin-top:-4px">記入者・担当者として選べる名前。1行に1人。両店で働く人は両方の店に入れます。</p>' +
    '<textarea class="big" id="staff" placeholder="例：中村&#10;山本&#10;田中">' + esc((p.staff || []).join('\n')) + '</textarea>' +
    '<h2>仕込み表の区分</h2>' +
    '<p class="hint" style="margin-top:-4px">仕込み表の見出しになる区分を、上から順に1行に1つ（例：切りもの、ソース類、魚介類、肉類）。空なら区分なしで並びます。</p>' +
    '<textarea class="big" id="groups" placeholder="例：切りもの&#10;ソース類&#10;魚介類&#10;肉類">' + esc((p.groups || []).join('\n')) + '</textarea>' +
    '<h2>仕込み品目</h2>' +
    '<p class="hint" style="margin-top:-4px">区分ごとに、並び順がそのまま仕込み表の順になります。「1人あたり」を入れると予約人数から必要量を計算します。「固定量」は人数に関係なく毎回仕込む量（両方入れると足し算）。保存日数は真空していないときの日数で、空なら' + DEFAULT_DAYS + '日。真空する品目は真空時の日数を、冷凍する品目は解凍してから何日もつかを入れます（空ならそのボタンは出ません）。</p>' +
    '<div id="mlist"></div>' +
    '<button type="button" class="secondary" id="addM" style="width:100%;height:46px;margin-top:4px">＋ 品目を追加</button>' +
    '</div>' +
    '<h2 style="margin-top:30px">メニューの分類（衛生管理）</h2>' +
    '<p class="hint" style="margin-top:-4px">お客様に出すメニューを3つに分けて、1行に1品。「衛生」タブの重要管理に表示されます。 <button type="button" class="linkbtn" data-ref>食中毒の原因一覧を見る</button></p>' +
    CRITICAL.map(it => '<h2>' + it.t + '</h2><p class="hint" style="margin-top:-6px">' + it.h + '</p>' +
      '<textarea class="big" id="plan_' + it.k + '" placeholder="例：カルパッチョ">' + esc((p[it.k] || []).join('\n')) + '</textarea>').join('') +
    '<h2>記入者</h2>' + byField('') +
    '<button class="primary" id="savePlan">計画を保存する</button>';
  bindBy();
  $('#savePlan').onclick = savePlan;
  $('#usePrep').onchange = e => { $('#prepSettings').hidden = !e.target.checked; };
  paintMaster();
}
async function savePlan() {
  const by = state.by.trim();
  if (!by) return toast('記入者を選んでください');
  const data = { usePrep: $('#usePrep').checked, places: draftPlaces(), groups: draftGroups(), staff: $('#staff').value.split('\n').map(s => s.trim()).filter(Boolean) };
  CRITICAL.forEach(it => data[it.k] = $('#plan_' + it.k).value.split('\n').map(s => s.trim()).filter(Boolean));
  data.items = planDraft.filter(it => String(it.name || '').trim()).map(it => ({
    id: it.id, name: String(it.name).trim(), cls: it.cls || '', unit: it.unit || 'g', place: it.place || '', group: it.group || '',
    per: optNum(it.per), fixed: optNum(it.fixed), days: optNum(it.days), vdays: optNum(it.vdays), fdays: optNum(it.fdays), fire: !!it.fire
  }));
  const before = state.planSavedAt;
  const btn = $('#savePlan'); btn.disabled = true; btn.textContent = '保存しています…';
  try {
    await apiPost({ type: 'plan', store: state.store, by: by, data: data });
    for (let i = 0; i < 4; i++) {
      await sleep(1500);
      try { await loadPlan(); } catch (e) { continue; }
      if (state.planSavedAt && state.planSavedAt !== before) { toast('計画を保存しました'); renderPlan(); return; }
    }
    toast('保存を確認できませんでした。もう一度開いて確かめてください');
  } catch (e) { toast('保存できませんでした：' + e.message); }
  btn.disabled = false; btn.textContent = '計画を保存する';
}

// ---------- ボタンの反応（まとめて受け取る） ----------
view.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;

  // 仕込みフォーム
  if (b.dataset.prep !== undefined) {
    const it = itemById(b.dataset.prep);
    if (it) { openForm = newForm(it, false); paintNeeds(); }
    return;
  }
  if (b.dataset.keep && openForm) {
    openForm.keep = b.dataset.keep;
    if (!openForm.expTouched) openForm.exp = openForm.keep === 'frz' ? '' : addDays(state.prepDate, lotDays(openForm.item, openForm.keep === 'vac'));
    if (openForm.keep === 'frz') { const fz = freezerPlace(); if (fz) openForm.pl = fz; }
    else if (openForm.item.place) openForm.pl = openForm.item.place;
    paintNeeds(); return;
  }
  if (b.dataset.fv && openForm) {
    openForm.v = b.dataset.fv;
    const form = b.closest('.form');
    form.querySelectorAll('.yn button').forEach(x => x.classList.toggle('on', x === b));
    const note = form.querySelector('.note'); note.hidden = openForm.v !== 'ng';
    if (!note.hidden) note.focus();
    return;
  }
  if (b.hasAttribute('data-ref')) { openRef(); return; }
  if (b.hasAttribute('data-add') && openForm) { addLot(); return; }
  if (b.hasAttribute('data-cancel')) { openForm = null; paintNeeds(); return; }

  // 在庫の操作
  const lotEl = b.closest('[data-lot]');
  if (lotEl && b.dataset.act) { const lot = lotById(lotEl.dataset.lot); if (lot) lotAction(lot, b.dataset.act); return; }

  // 計画：品目の追加・並べ替え・削除
  if (b.id === 'addM') {
    planDraft.push({ id: uid('m'), name: '', cls: '', unit: 'g', place: '', group: '', per: '', fixed: '', days: '', vdays: '', fdays: '', fire: false });
    paintMaster();
    const rows = document.querySelectorAll('.mrow');
    rows[rows.length - 1].querySelector('input').focus();
    return;
  }
  const mrow = b.closest('.mrow');
  if (mrow && b.hasAttribute('data-del')) {
    if (!confirm('この品目を消しますか？（「計画を保存する」を押すまで確定しません）')) return;
    planDraft = planDraft.filter(x => x.id !== mrow.dataset.id); paintMaster(); return;
  }
  if (mrow && b.hasAttribute('data-up')) {
    const i = planDraft.findIndex(x => x.id === mrow.dataset.id);
    if (i > 0) { const x = planDraft[i]; planDraft[i] = planDraft[i - 1]; planDraft[i - 1] = x; paintMaster(); }
    return;
  }

  // 衛生・振り返りの○×
  const item = b.closest('.item[data-g]');
  if (!item || !b.dataset.v) return;
  const k = item.dataset.k;
  if (item.dataset.g === 'rec') {
    rec.answers[k] = rec.answers[k] || { v: '', note: '' };
    rec.answers[k].v = b.dataset.v;
    item.classList.remove('ok', 'ng'); item.classList.add(b.dataset.v);
    item.querySelectorAll('.yn button').forEach(x => x.classList.toggle('on', x === b));
    const note = item.querySelector('.note'); note.hidden = b.dataset.v !== 'ng';
    if (!note.hidden) note.focus();
    progress();
  } else if (item.dataset.g === 'rev') {
    rev.answers[k] = b.dataset.v;
    item.querySelectorAll('.opts button').forEach(x => x.classList.toggle('on', x === b));
  }
});

function onFieldInput(e) {
  const t = e.target;
  // 計画
  const mrow = t.closest('.mrow');
  if (mrow && t.dataset.f) {
    const it = planDraft.find(x => x.id === mrow.dataset.id);
    if (!it) return;
    it[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.f === 'cls' && t.value === 'c3' && !it.fireTouched) { it.fire = true; mrow.querySelector('[data-f="fire"]').checked = true; }
    if (t.dataset.f === 'fire') it.fireTouched = true;
    return;
  }
  if (t.id === 'places' || t.id === 'groups') { if (e.type === 'change') paintMaster(); return; }
  // 仕込みフォーム
  if (openForm && t.closest('.form')) {
    if (t.classList.contains('fq')) openForm.qty = t.value;
    if (t.classList.contains('fpl')) openForm.pl = t.value;
    if (t.classList.contains('fexp')) { openForm.exp = t.value; openForm.expTouched = true; }
    if (t.classList.contains('note')) openForm.note = t.value;
    if (t.classList.contains('fcls')) { openForm.item.cls = t.value; if (t.value === 'c3') openForm.item.fire = true; }
    if (t.classList.contains('funit')) { openForm.item.unit = t.value; const uEl = t.closest('.form').querySelector('.unit'); if (uEl) uEl.textContent = t.value; }
    return;
  }
  // 在庫の「直す」
  const lotEl = t.closest('.lot');
  if (lotEl && e.type === 'change') {
    const lot = lotById(lotEl.dataset.lot); if (!lot) return;
    if (t.classList.contains('eq')) lot.q = num(t.value);
    if (t.classList.contains('eexp')) lot.exp = t.value;
    if (t.classList.contains('epl')) lot.pl = t.value;
    lot.at = nowIso(); markDirty(); paintPrep(); return;
  }
  // 衛生の×メモ
  const item = t.closest('.item[data-g="rec"]');
  if (item && t.classList.contains('note')) rec.answers[item.dataset.k].note = t.value;
}
view.addEventListener('input', onFieldInput);
view.addEventListener('change', onFieldInput);
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => setStore(b.dataset.store));
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#saveStock').onclick = saveStock;
$('#refClose').onclick = () => { $('#refpanel').hidden = true; };

// ---------- ご意見箱 ----------
let fbKind = FEEDBACK_KINDS[0];

  $('#fbName').innerHTML = staff.length
    ? '<label class="f">名前（任意）<select id="fbWho">' + opt([''].concat(staff), state.by, ['（匿名）'].concat(staff)) + '</select></label>'

$('#fbBtn').onclick = openFeedback;
$('#fbCancel').onclick = () => { $('#fbpanel').hidden = true; };
$('#fbpanel').addEventListener('click', e => { if (e.target === $('#fbpanel')) $('#fbpanel').hidden = true; });
$('#fbKinds').addEventListener('click', e => {

$('#fbSend').onclick = () => {
  const text = $('#fbText').value.trim();
  if (!text) return toast('内容を書いてください');
  if (FEEDBACK_URL.indexOf('https://') !== 0) return toast('ご意見箱の送り先がまだ設定されていません');
  const name = ($('#fbWho').value || '').trim();
  try {
    fetch(FEEDBACK_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'save_feedback', data: { feedback: { at: new Date().toLocaleString('ja-JP'), app: FEEDBACK_APP_NAME + '（' + STORES[state.store] + '）', name: name, kind: fbKind, text: text } } }) });
  } catch (e) { /* no-corsなので結果は見えない */ }
  $('#fbpanel').hidden = true;
  toast('✅ 送信しました。ありがとうございます');
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// 起動
document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
setStore('nakamura');
